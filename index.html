<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地音乐 · MP3 播放器</title>
<style>
  :root { color-scheme: light; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; color: #263449; background: #f1f3f6; }
  * { box-sizing: border-box; }
  body { max-width: 850px; margin: 48px auto; padding: 0 24px 32px; }
  .card { background: #fff; border: 1px solid #e5e9ef; border-radius: 14px; box-shadow: 0 4px 18px #22304a06; }
  .player-card { padding: 26px; margin-bottom: 22px; }
  .now-heading { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .record { display: grid; place-items: center; flex: 0 0 58px; height: 58px; border-radius: 12px; background: #edf4ff; color: #1875ea; }
  .record svg { width: 30px; height: 30px; animation: record-spin 12s linear infinite; animation-play-state: paused; transform-origin: center; }
  .record.is-playing svg { animation-play-state: running; }
  @keyframes record-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .record svg { animation: none; } }
  .now-copy { min-width: 0; }
  .eyebrow { margin: 0 0 3px; color: #687588; font-size: .875rem; }
  #now { font-size: 1.125rem; font-weight: 600; overflow-wrap: anywhere; }
  audio { display: none; }
  .progress-row { display: flex; align-items: center; gap: 12px; min-height: 24px; }
  .time { min-width: 36px; color: #687588; font-size: .875rem; font-variant-numeric: tabular-nums; }
  #duration { text-align: right; }
  #seek { --progress: 0%; appearance: none; -webkit-appearance: none; flex: 1; min-width: 0; height: 5px; margin: 0; padding: 0; border: 0; border-radius: 99px; cursor: pointer; background: linear-gradient(to right, #1875ea var(--progress), #dde5ef var(--progress)); }
  #seek::-webkit-slider-runnable-track { height: 5px; border-radius: 99px; }
  #seek::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 12px; height: 12px; margin-top: -3.5px; border: 0; border-radius: 50%; background: #1875ea; box-shadow: 0 0 0 3px #fff; }
  #seek::-moz-range-track { height: 5px; background: transparent; }
  #seek::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: #1875ea; box-shadow: 0 0 0 3px #fff; }
  #seek:disabled { cursor: default; opacity: .45; }
  #seek:focus-visible { outline: 2px solid #1875ea; outline-offset: 6px; }
  .transport { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
  button { min-height: 42px; font: inherit; font-size: .875rem; font-weight: 500; cursor: pointer; color: #36516f; background: #fff; border: 1px solid #dce3ed; border-radius: 8px; padding: 8px 16px; }
  button:hover { background: #f3f7fc; border-color: #afc6e3; }
  button:active { background: #eaf2ff; }
  button:focus-visible { outline: 3px solid #1875ea; outline-offset: 3px; }
  .transport .icon-button { display: grid; place-items: center; flex: 0 0 auto; width: 42px; height: 42px; min-height: 42px; padding: 0; color: #52677f; border-color: transparent; background: transparent; border-radius: 50%; }
  .transport .icon-button:hover { color: #1162ce; background: #edf4ff; }
  .control-icon { display: block; width: 21px; height: 21px; }
  .control-icon[hidden] { display: none; }
  #toggle-play { width: 44px; height: 44px; color: #fff; background: #1875ea; }
  #toggle-play:hover { background: #0962d2; }
  #shuffle { margin-left: auto; }
  #shuffle[aria-pressed="true"] { color: #1162ce; background: #edf4ff; border-color: #91baff; }
  #notice { margin: 12px 0 0; color: #687588; font-size: .875rem; }
  #notice:empty { display: none; }
  #queue-status { margin: 12px 0 0; color: #36516f; font-size: .875rem; overflow-wrap: anywhere; }
  #queue-status:empty { display: none; }
  .lyrics-shell { margin-top: 20px; border-top: 1px solid #edf0f4; }
  #lyric-status { margin: 14px 0 0; color: #687588; text-align: center; font-size: .875rem; }
  #lyric-status:empty { display: none; }
  #lyrics { position: relative; height: 180px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; -ms-overflow-style: none; scroll-behavior: auto; }
  #lyrics::-webkit-scrollbar { display: none; width: 0; height: 0; }
  #lyrics:focus-visible { outline: 2px solid #91baff; outline-offset: -2px; }
  #lyric-lines { padding: 58px 0; }
  #lyric-lines p { margin: 0; padding: 8px 12px; text-align: center; white-space: pre-line; overflow-wrap: anywhere; color: #687588; font-size: calc(.9375rem + var(--lyric-emphasis, 0px)); line-height: 1.625rem; }
  #lyric-lines p.active { color: #1162ce; font-weight: 650; }
  .search-card { padding: 18px 20px; margin-bottom: 18px; }
  .search-label { display: block; margin-bottom: 8px; font-size: .9375rem; font-weight: 600; }
  #search { width: 100%; min-height: 46px; padding: 10px 14px; border: 1px solid #dce3ed; border-radius: 8px; background: #f8fafc; color: inherit; font: inherit; }
  #search:focus-visible { outline: 2px solid #1875ea; outline-offset: 2px; background: #fff; }
  #search-status { margin: 12px 0 0; color: #687588; font-size: .875rem; }
  #library summary { padding: 18px 24px; cursor: pointer; color: #36516f; font-size: .9375rem; font-weight: 600; }
  #library summary:focus-visible { outline: 2px solid #1875ea; outline-offset: 2px; }
  #library[open] summary { border-bottom: 1px solid #edf0f4; }
  .library-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 22px 24px; border-bottom: 1px solid #edf0f4; }
  h2 { margin: 0; font-size: 1.0625rem; font-weight: 650; }
  #status { margin: 4px 0 0; color: #687588; font-size: .875rem; }
  #refresh { flex-shrink: 0; }
  .track-list { list-style: none; padding: 8px; margin: 0; }
  .track-list:empty { padding: 0; }
  .track-list li + li { border-top: 1px solid #f0f2f6; }
  .track-list li { display: flex; align-items: center; gap: 8px; }
  .track-list .track-play { position: relative; display: block; flex: 1; min-width: 0; border: 0; border-radius: 7px; min-height: 54px; padding: 14px 76px 14px 16px; text-align: left; overflow-wrap: anywhere; color: #334155; font-size: 1rem; font-weight: 400; }
  .track-list .track-play::after { content: '播放'; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: .875rem; color: #6b7d94; }
  .track-list .track-play:hover { background: #f5f8fc; }
  .track-list .track-play[aria-current="true"] { color: #1162ce; background: #edf4ff; font-weight: 600; }
  .track-list .track-play[aria-current="true"]::after { content: '已选择'; color: #1162ce; font-weight: 400; }
  .track-list .queue-add { flex-shrink: 0; margin-right: 8px; padding: 8px 10px; white-space: nowrap; }
  .track-list .queue-add[aria-pressed="true"] { color: #1162ce; background: #edf4ff; border-color: #91baff; }
  @media (max-width: 540px) {
    body { margin: 26px auto; padding: 0 14px 20px; }
    .player-card { padding: 20px 16px; margin-bottom: 16px; }
    .library-head { padding: 18px 16px; align-items: flex-start; gap: 10px; }
    #refresh { padding: 8px 10px; }
    .now-heading { gap: 12px; }
    .record { flex-basis: 48px; height: 48px; }
    .search-card { padding: 16px; }
    #library summary { padding: 16px; }
    .track-list .track-play { padding: 12px 10px; }
    .track-list .track-play::after { display: none; }
  }
</style>
<body>
<main>
  <section class="card player-card" aria-label="播放器">
    <div class="now-heading">
      <div class="record" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12a6 6 0 0 1 6-6m0 12a6 6 0 0 0 6-6"/></svg></div>
      <div class="now-copy"><p class="eyebrow">当前歌曲</p><div id="now" aria-live="polite">选择一首歌曲开始播放</div></div>
    </div>
    <audio id="player" preload="metadata"></audio>
    <div class="progress-row">
      <span id="elapsed" class="time">0:00</span>
      <input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="播放进度" disabled>
      <span id="duration" class="time">--:--</span>
    </div>
    <div class="transport">
      <button id="previous" class="icon-button" type="button" aria-label="上一首" title="上一首"><svg class="control-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 5h2v14H5zm14 0v14L8 12z"/></svg></button>
      <button id="toggle-play" class="icon-button" type="button" aria-label="播放" title="播放">
        <svg id="play-icon" class="control-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pause-icon" class="control-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <button id="next" class="icon-button" type="button" aria-label="下一首" title="下一首"><svg class="control-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17 5h2v14h-2zM5 5l11 7-11 7z"/></svg></button>
      <button id="shuffle" class="icon-button" type="button" aria-label="顺序播放，点击切换为随机播放" title="顺序播放，点击切换为随机播放" aria-pressed="false">
        <svg id="sequence-icon" class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h11m2-3 3 3-3 3m-2-3h5"/></svg>
        <svg id="shuffle-icon" class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M4 7h3c4 0 6 10 10 10h3m-3-3 3 3-3 3M4 17h3c1.8 0 3.2-2 4.5-4.5M14 8.5C15 7.5 16 7 17 7h3m-3-3 3 3-3 3"/></svg>
      </button>
    </div>
    <p id="queue-status" role="status"></p>
    <p id="notice" role="status"></p>
    <div class="lyrics-shell">
      <p id="lyric-status" aria-live="polite">选择歌曲查看歌词</p>
      <div id="lyrics" hidden tabindex="0" aria-label="歌曲歌词"><div id="lyric-lines"></div></div>
    </div>
  </section>
  <section class="card search-card" aria-label="歌曲搜索">
    <label class="search-label" for="search">搜索歌曲</label>
    <input id="search" type="search" placeholder="输入歌名或歌手" autocomplete="off">
    <p id="search-status" role="status" hidden></p>
    <ul id="results" class="track-list" aria-label="搜索结果" hidden></ul>
  </section>
  <section class="card" aria-labelledby="library-title">
    <div class="library-head">
      <div><h2 id="library-title">歌曲列表</h2><p id="status" role="status">正在读取歌曲…</p></div>
      <button id="refresh" type="button">刷新列表</button>
    </div>
    <details id="library">
      <summary>全部歌曲</summary>
      <ul id="tracks" class="track-list" aria-label="全部歌曲"></ul>
    </details>
  </section>
</main>
<script>
  const player = document.querySelector('#player');
  const record = document.querySelector('.record');
  const playButton = document.querySelector('#toggle-play');
  const playIcon = document.querySelector('#play-icon');
  const pauseIcon = document.querySelector('#pause-icon');
  const seek = document.querySelector('#seek');
  const elapsed = document.querySelector('#elapsed');
  const duration = document.querySelector('#duration');
  const shuffleIcon = document.querySelector('#shuffle-icon');
  const sequenceIcon = document.querySelector('#sequence-icon');
  const list = document.querySelector('#tracks');
  const now = document.querySelector('#now');
  const status = document.querySelector('#status');
  const shuffleButton = document.querySelector('#shuffle');
  const library = document.querySelector('#library');
  const search = document.querySelector('#search');
  const results = document.querySelector('#results');
  const searchStatus = document.querySelector('#search-status');
  const notice = document.querySelector('#notice');
  const queueStatus = document.querySelector('#queue-status');
  const lyricPanel = document.querySelector('#lyrics');
  const lyricLines = document.querySelector('#lyric-lines');
  const lyricStatus = document.querySelector('#lyric-status');
  const STATE_KEY = 'mp3-player-state-v1';
  let tracks = [], current = -1, shuffle = false, libraryId = null;
  let pendingPosition = null, lastSavedAt = 0, lyricRequest = 0, lyricIndex = -1, refreshRequest = 0;
  let timedLyrics = [];
  const history = [];
  const upNext = [];
  const forward = [];
  const shuffleOrder = [];
  let shuffleReady = false;
  let scrubbing = false;
  let centeredLyric = -2, manualScrollUntil = 0, manualPointer = false, manualTouch = false;

  function formatTime(value) {
    const seconds = Math.max(0, Math.floor(Number.isFinite(value) ? value : 0));
    const minutes = Math.floor(seconds / 60);
    const tail = String(seconds % 60).padStart(2, '0');
    return minutes >= 60 ? `${Math.floor(minutes / 60)}:${String(minutes % 60).padStart(2, '0')}:${tail}` : `${minutes}:${tail}`;
  }
  function updateProgress() {
    const length = player.duration;
    const available = Number.isFinite(length) && length > 0 && current >= 0;
    seek.disabled = !available;
    seek.max = available ? String(length) : '0';
    duration.textContent = available ? formatTime(length) : '--:--';
    const position = scrubbing ? Number(seek.value) : (pendingPosition ?? player.currentTime ?? 0);
    if (!scrubbing) seek.value = String(available ? Math.max(0, Math.min(position, length)) : 0);
    elapsed.textContent = formatTime(position);
    seek.style.setProperty('--progress', `${available ? Math.max(0, Math.min(100, position / length * 100)) : 0}%`);
    seek.setAttribute('aria-valuetext', `${formatTime(position)} / ${available ? formatTime(length) : '--:--'}`);
  }
  function updatePlaybackUI() {
    const active = !player.paused && !player.ended && current >= 0;
    playIcon.toggleAttribute('hidden', active);
    pauseIcon.toggleAttribute('hidden', !active);
    playButton.setAttribute('aria-label', active ? '暂停' : '播放');
    playButton.title = active ? '暂停' : '播放';
  }
  function updateModeUI() {
    shuffleButton.setAttribute('aria-pressed', String(shuffle));
    const label = shuffle ? '随机播放，点击切换为顺序播放' : '顺序播放，点击切换为随机播放';
    shuffleButton.setAttribute('aria-label', label);
    shuffleButton.title = label;
    shuffleIcon.toggleAttribute('hidden', !shuffle);
    sequenceIcon.toggleAttribute('hidden', shuffle);
  }
  async function togglePlayback() {
    if (current < 0) return playNext();
    if (!player.paused && !player.ended) { player.pause(); return; }
    try { await player.play(); }
    catch { notice.textContent = '无法开始播放，请检查音频文件后重试。'; }
    updatePlaybackUI();
  }

  function validTracks(data) {
    const seen = new Set();
    return Array.isArray(data) ? data.filter(track => {
      try {
        if (!track || typeof track.name !== 'string' || !/\.mp3$/i.test(track.name)
          || /[/\\]/.test(track.name) || typeof track.url !== 'string'
          || !/^\/media\/[^/?#]+$/.test(track.url)
          || decodeURIComponent(track.url.slice(7)) !== track.name || seen.has(track.url)) return false;
        seen.add(track.url);
        return true;
      } catch { return false; }
    }).map(({ name, url }) => ({ name, url })) : [];
  }
  function readState() {
    try {
      const saved = JSON.parse(localStorage.getItem(STATE_KEY));
      return saved?.version === 1 ? saved : {};
    } catch { return {}; }
  }
  function saveState(force = true) {
    if (!force && Date.now() - lastSavedAt < 1000) return;
    try {
      localStorage.setItem(STATE_KEY, JSON.stringify({
        version: 1, libraryId, tracks, currentUrl: tracks[current]?.url || null,
        position: pendingPosition ?? (Number.isFinite(player.currentTime) ? player.currentTime : 0),
        shuffle, history, forward, shuffleOrder, upNext, query: search.value, expanded: library.open,
      }));
      lastSavedAt = Date.now();
    } catch { /* Playback also works when browser storage is unavailable. */ }
  }
  function updateStatus() {
    status.textContent = tracks.length
      ? `共 ${tracks.length} 首 · ${shuffle ? '随机播放' : '顺序播放，末尾循环'}`
      : '目录里没有 MP3 文件，放入歌曲后点击刷新列表。';
  }
  function markCurrent() {
    for (const container of [list, results]) {
      for (const li of container.children) {
        const button = li.firstChild;
        button.setAttribute('aria-current', String(button.getAttribute('data-url') === tracks[current]?.url));
      }
    }
  }
  function updateQueueUI() {
    const queued = new Set(upNext);
    for (const container of [list, results]) {
      for (const li of container.children) {
        const button = li.children[1];
        const selected = queued.has(button.getAttribute('data-url'));
        button.textContent = selected ? '取消待播' : '下一首播放';
        button.setAttribute('aria-pressed', String(selected));
        button.setAttribute('aria-label', `${selected ? '取消待播' : '下一首播放'}：${li.firstChild.textContent}`);
      }
    }
    const first = tracks.find(track => track.url === upNext[0]);
    queueStatus.textContent = first ? `待播 ${upNext.length} 首 · 下一首：${first.name}` : '';
  }
  function toggleNext(url) {
    if (!tracks.some(track => track.url === url)) return;
    const index = upNext.indexOf(url);
    if (index >= 0) upNext.splice(index, 1);
    else upNext.push(url);
    updateQueueUI();
    saveState();
  }
  function renderTracks(container, indices) {
    container.replaceChildren();
    for (const i of indices) {
      const li = document.createElement('li');
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'track-play';
      button.textContent = tracks[i].name;
      button.setAttribute('data-url', tracks[i].url);
      button.addEventListener('click', () => play(i));
      li.append(button);
      const queueButton = document.createElement('button');
      queueButton.type = 'button';
      queueButton.className = 'queue-add';
      const url = tracks[i].url;
      queueButton.setAttribute('data-url', url);
      queueButton.addEventListener('click', () => toggleNext(url));
      li.append(queueButton);
      container.append(li);
    }
  }
  function renderSearch() {
    const query = search.value.trim().toLocaleLowerCase();
    const indices = tracks.map((_, i) => i).filter(i => tracks[i].name.toLocaleLowerCase().includes(query));
    renderTracks(results, query ? indices : []);
    results.hidden = !query;
    searchStatus.hidden = !query;
    searchStatus.textContent = query ? (indices.length ? `找到 ${indices.length} 首` : '没有找到匹配的歌曲') : '';
    markCurrent();
    updateQueueUI();
  }
  function renderLibrary() {
    renderTracks(list, tracks.map((_, i) => i));
    renderSearch();
    updateStatus();
  }
  function shuffled(urls) {
    const result = [...urls];
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }
  function startShuffleRound(includeCurrent = false) {
    const currentUrl = tracks[current]?.url;
    const urls = shuffled(tracks.filter(track => includeCurrent || track.url !== currentUrl).map(track => track.url));
    if (urls.length > 1 && urls[0] === currentUrl) [urls[0], urls[1]] = [urls[1], urls[0]];
    shuffleOrder.splice(0, shuffleOrder.length, ...urls);
    shuffleReady = true;
  }
  async function play(index, remember = true, autoplay = true, position = 0, reason = 'select') {
    if (!tracks.length) return;
    const next = (index + tracks.length) % tracks.length;
    if (remember && current >= 0 && next !== current) {
      history.push(tracks[current].url);
      if (history.length > 200) history.shift();
    }
    current = next;
    record.classList.toggle('is-playing', false);
    if (autoplay && reason !== 'history') {
      const pending = shuffleOrder.indexOf(tracks[current].url);
      if (pending >= 0) shuffleOrder.splice(pending, 1);
      if (reason === 'select') forward.length = 0;
      else {
        for (let i = forward.length - 1; i >= 0; i--) {
          if (forward[i] === tracks[current].url) forward.splice(i, 1);
        }
      }
    }
    const queued = upNext.indexOf(tracks[current].url);
    if (autoplay && reason !== 'history' && queued >= 0) upNext.splice(queued, 1);
    now.textContent = tracks[current].name;
    pendingPosition = position;
    scrubbing = false;
    player.src = tracks[current].url;
    updateProgress();
    updatePlaybackUI();
    notice.textContent = autoplay ? '' : '已恢复上次歌曲与进度，点击播放继续。';
    markCurrent();
    updateQueueUI();
    updateStatus();
    saveState();
    loadLyrics(tracks[current]);
    if (!autoplay) return;
    try { await player.play(); }
    catch (error) {
      if (error.name !== 'AbortError') notice.textContent = '请点击播放器播放键继续；若仍失败，请检查音频文件。';
    }
  }
  function playNext() {
    if (!tracks.length) return;
    while (upNext.length) {
      const url = upNext.shift();
      const index = tracks.findIndex(track => track.url === url);
      if (index >= 0) return play(index, true, true, 0, 'next');
    }
    while (forward.length) {
      const url = forward.pop();
      const index = tracks.findIndex(track => track.url === url);
      if (index >= 0 && index !== current) return play(index, true, true, 0, 'history');
    }
    if (!shuffle || tracks.length === 1) return play(current + 1, true, true, 0, 'next');
    if (!shuffleReady) startShuffleRound();
    if (!shuffleOrder.length) startShuffleRound(true);
    const url = shuffleOrder.shift();
    return play(tracks.findIndex(track => track.url === url), true, true, 0, 'next');
  }
  function playPrevious() {
    function visit(index) {
      if (current >= 0 && current !== index) {
        forward.push(tracks[current].url);
        if (forward.length > 200) forward.shift();
      }
      return play(index, false, true, 0, 'history');
    }
    while (history.length) {
      const url = history.pop();
      const index = tracks.findIndex(track => track.url === url);
      if (index >= 0) return visit(index);
    }
    return visit(current < 0 ? 0 : (current - 1 + tracks.length) % tracks.length);
  }
  function clearSelection() {
    current = -1;
    pendingPosition = null;
    player.removeAttribute('src');
    player.load();
    scrubbing = false;
    updateProgress();
    updatePlaybackUI();
    record.classList.toggle('is-playing', false);
    now.textContent = '选择一首歌曲开始播放';
    notice.textContent = '';
    lyricRequest++;
    timedLyrics = [];
    resetLyricFollow();
    lyricLines.replaceChildren();
    lyricPanel.hidden = true;
    lyricStatus.textContent = '选择歌曲查看歌词';
  }
  async function refresh() {
    const request = ++refreshRequest;
    try {
      const response = await fetch('api/tracks', { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();
      if (request !== refreshRequest) return;
      if (!Array.isArray(data)) throw new Error('Invalid track list');
      const incoming = validTracks(data);
      const incomingId = response.headers.get('X-Library-Id');
      const changedFolder = libraryId && incomingId && libraryId !== incomingId;
      const oldUrl = tracks[current]?.url;
      const byUrl = new Map(incoming.map(track => [track.url, track]));
      const previousUrls = new Set(tracks.map(track => track.url));
      const surviving = changedFolder ? [] : tracks.filter(track => byUrl.has(track.url));
      const existing = new Set(surviving.map(track => track.url));
      tracks = [...surviving.map(track => byUrl.get(track.url)), ...incoming.filter(track => !existing.has(track.url))];
      if (changedFolder) history.length = 0;
      const remainingForward = changedFolder ? [] : forward.filter(url => byUrl.has(url));
      forward.splice(0, forward.length, ...remainingForward);
      const remainingQueue = changedFolder ? [] : upNext.filter(url => byUrl.has(url));
      upNext.splice(0, upNext.length, ...remainingQueue);
      libraryId = incomingId || libraryId;
      current = changedFolder ? -1 : tracks.findIndex(track => track.url === oldUrl);
      if (current < 0 && oldUrl) clearSelection();
      if (changedFolder) { shuffleOrder.length = 0; shuffleReady = false; }
      if (shuffle) {
        if (!shuffleReady) startShuffleRound();
        else {
          const remaining = shuffleOrder.filter(url => byUrl.has(url));
          const added = shuffled(incoming.filter(track => !previousUrls.has(track.url) && track.url !== tracks[current]?.url).map(track => track.url));
          shuffleOrder.splice(0, shuffleOrder.length, ...remaining, ...added);
        }
      }
      renderLibrary();
      saveState();
    } catch {
      if (request !== refreshRequest) return;
      notice.textContent = tracks.length ? '暂时无法更新列表，已保留上次记录。' : '读取列表失败，请确认服务正在运行，然后刷新列表。';
    }
  }

  function parseLrc(text) {
    const offset = Number(text.match(/\[offset:([+-]?\d+)\]/i)?.[1] || 0) / 1000;
    const groups = new Map(), plain = [];
    for (const row of text.replace(/^\uFEFF/, '').split(/\r?\n/)) {
      const pattern = /\[(\d{1,3}):([0-5]?\d(?:[.:]\d{1,3})?)\]/g;
      const stamps = [...row.matchAll(pattern)];
      const words = row.replace(pattern, '').replace(/<\d{1,3}:\d{2}(?:\.\d+)?>/g, '').trim();
      if (stamps.length) {
        for (const stamp of stamps) {
          const time = Number(stamp[1]) * 60 + Number(stamp[2].replace(':', '.')) - offset;
          if (!groups.has(time)) groups.set(time, []);
          if (words && !groups.get(time).includes(words)) groups.get(time).push(words);
        }
      } else if (words && !/^\[[a-z]+:/i.test(words)) plain.push(words);
    }
    return { lines: [...groups].sort((a, b) => a[0] - b[0]).map(([time, words]) => ({ time, text: words.join('\n') })), plain: plain.join('\n') };
  }
  async function loadLyrics(track) {
    const request = ++lyricRequest;
    timedLyrics = [];
    resetLyricFollow();
    lyricLines.replaceChildren();
    lyricPanel.hidden = true;
    lyricStatus.textContent = '正在读取歌词…';
    try {
      const response = await fetch(track.url.replace('/media/', '/lyrics/'), { cache: 'no-cache' });
      if (!response.ok) throw new Error('No lyrics');
      const parsed = parseLrc(await response.text());
      if (request !== lyricRequest) return;
      timedLyrics = parsed.lines;
      for (const line of timedLyrics.length ? timedLyrics : (parsed.plain ? [{ text: parsed.plain }] : [])) {
        const p = document.createElement('p');
        p.textContent = line.text;
        lyricLines.append(p);
      }
      lyricPanel.hidden = !lyricLines.children.length;
      lyricStatus.textContent = timedLyrics.length ? '' : (parsed.plain ? '歌词未带时间轴' : '暂无歌词');
      lyricPanel.scrollTop = 0;
      updateLyrics();
    } catch {
      if (request === lyricRequest) lyricStatus.textContent = '暂无歌词';
    }
  }
  function resetLyricFollow() {
    lyricIndex = -1;
    centeredLyric = -2;
    manualScrollUntil = 0;
    manualPointer = false;
    manualTouch = false;
  }
  function manualLyricScroll() {
    const interrupt = centeredLyric !== -2;
    centeredLyric = -2;
    manualScrollUntil = Date.now() + 3000;
    // Cancel automatic easing once; native wheel/touch movement stays untouched.
    if (interrupt) lyricPanel.scrollTo({ top: lyricPanel.scrollTop, behavior: 'auto' });
  }
  function releaseLyricPointer() {
    if (!manualPointer) return;
    manualPointer = false;
    manualLyricScroll();
  }
  function updateLyrics() {
    if (!timedLyrics.length) return;
    const time = player.currentTime;
    let low = 0, high = timedLyrics.length;
    while (low < high) {
      const middle = Math.floor((low + high) / 2);
      if (timedLyrics[middle].time <= time) low = middle + 1;
      else high = middle;
    }
    const active = low - 1;
    if (active !== lyricIndex) {
      lyricIndex = active;
      [...lyricLines.children].forEach((p, i) => {
        p.classList.toggle('active', i === active);
        const emphasis = active >= 0 ? Math.max(0, 4 - Math.abs(i - active)) : 0;
        p.style.setProperty('--lyric-emphasis', `${emphasis}px`);
      });
    }
    if (manualPointer || manualTouch || Date.now() < manualScrollUntil || active === centeredLyric) return;
    centeredLyric = active;
    const line = lyricLines.children[active];
    lyricPanel.scrollTo({
      top: line ? Math.max(0, line.offsetTop - lyricPanel.clientHeight / 2 + (line.offsetHeight || 32) / 2) : 0,
      behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
    });
  }
  document.querySelector('#previous').onclick = playPrevious;
  playButton.onclick = togglePlayback;
  document.querySelector('#next').onclick = playNext;
  document.querySelector('#refresh').onclick = refresh;
  search.addEventListener('input', () => { renderSearch(); saveState(); });
  library.addEventListener('toggle', () => saveState());
  lyricPanel.addEventListener('wheel', manualLyricScroll, { passive: true });
  lyricPanel.addEventListener('touchstart', () => { manualTouch = true; manualLyricScroll(); }, { passive: true });
  lyricPanel.addEventListener('touchmove', manualLyricScroll, { passive: true });
  const releaseLyricTouch = () => { if (manualTouch) { manualTouch = false; manualLyricScroll(); } };
  lyricPanel.addEventListener('touchend', releaseLyricTouch, { passive: true });
  lyricPanel.addEventListener('touchcancel', releaseLyricTouch, { passive: true });
  lyricPanel.addEventListener('pointerdown', () => { manualPointer = true; manualLyricScroll(); }, { passive: true });
  lyricPanel.addEventListener('keydown', event => {
    if (['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End', ' '].includes(event.key)) manualLyricScroll();
  });
  window.addEventListener('pointerup', releaseLyricPointer);
  window.addEventListener('pointercancel', releaseLyricPointer);
  seek.addEventListener('input', () => { scrubbing = true; updateProgress(); });
  seek.addEventListener('pointercancel', () => { scrubbing = false; updateProgress(); });
  seek.addEventListener('change', () => {
    if (!seek.disabled && Number.isFinite(Number(seek.value))) {
      try {
        player.currentTime = Math.max(0, Math.min(Number(seek.value), player.duration));
        pendingPosition = null;
      } catch { notice.textContent = '暂时无法跳转，请稍后重试。'; }
    }
    scrubbing = false;
    updateProgress();
    updateLyrics();
    saveState();
  });
  shuffleButton.onclick = () => {
    shuffle = !shuffle;
    forward.length = 0;
    if (shuffle) startShuffleRound();
    else { shuffleOrder.length = 0; shuffleReady = false; }
    updateModeUI();
    updateStatus();
    saveState();
  };
  player.addEventListener('ended', () => { record.classList.toggle('is-playing', false); updatePlaybackUI(); return playNext(); });
  player.addEventListener('loadedmetadata', () => {
    if (pendingPosition !== null) {
      const target = Number.isFinite(player.duration) ? Math.min(pendingPosition, player.duration) : pendingPosition;
      try { player.currentTime = Math.max(0, target); pendingPosition = null; } catch { /* Retry when metadata is ready. */ }
    }
    updateLyrics();
    updateProgress();
    saveState();
  });
  player.addEventListener('durationchange', updateProgress);
  player.addEventListener('timeupdate', () => { updateLyrics(); updateProgress(); saveState(false); });
  player.addEventListener('seeked', () => { updateLyrics(); updateProgress(); saveState(); });
  player.addEventListener('pause', () => { record.classList.toggle('is-playing', false); updatePlaybackUI(); saveState(); });
  player.addEventListener('playing', () => record.classList.toggle('is-playing', !player.paused && !player.ended));
  player.addEventListener('waiting', () => record.classList.toggle('is-playing', false));
  player.addEventListener('play', () => { notice.textContent = ''; updatePlaybackUI(); saveState(); });
  player.addEventListener('error', () => { record.classList.toggle('is-playing', false); updatePlaybackUI(); notice.textContent = '音频读取失败或格式不受支持，请检查文件，或选择另一首。'; });
  window.addEventListener('pagehide', () => saveState());

  const saved = readState();
  tracks = validTracks(saved.tracks);
  shuffle = saved.shuffle === true;
  updateModeUI();
  libraryId = typeof saved.libraryId === 'string' ? saved.libraryId : null;
  search.value = typeof saved.query === 'string' ? saved.query.slice(0, 500) : '';
  library.open = saved.expanded === true;
  history.push(...(Array.isArray(saved.history) ? saved.history.filter(url => tracks.some(track => track.url === url)).slice(-200) : []));
  upNext.push(...new Set(Array.isArray(saved.upNext) ? saved.upNext.filter(url => tracks.some(track => track.url === url)) : []));
  forward.push(...(Array.isArray(saved.forward) ? saved.forward.filter(url => tracks.some(track => track.url === url)).slice(-200) : []));
  shuffleOrder.push(...new Set(Array.isArray(saved.shuffleOrder) ? saved.shuffleOrder.filter(url => tracks.some(track => track.url === url)) : []));
  shuffleReady = Array.isArray(saved.shuffleOrder);
  renderLibrary();
  const restored = tracks.findIndex(track => track.url === saved.currentUrl);
  if (restored >= 0) play(restored, false, false, Number.isFinite(saved.position) && saved.position >= 0 ? saved.position : 0);
  if (shuffle && !shuffleReady) { startShuffleRound(); saveState(); }
  updateProgress();
  updatePlaybackUI();
  refresh();
</script>
</body>
</html>
